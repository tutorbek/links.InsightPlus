<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Qo'ng'iroq qilish — InsightPlus</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
    }
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      background-color: #ffffff !important;
      color: #18181b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
    }
    h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #18181b;
    }
    p.phone {
      font-size: 23px;
      font-weight: 700;
      margin: 14px 0 20px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #18181b;
      letter-spacing: 0.5px;
    }
    a.call-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      background-color: #18181b;
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15.5px;
      font-weight: 600;
      width: 100%;
      max-width: 300px;
      transition: all 0.18s ease;
      box-sizing: border-box;
    }
    a.call-btn:active {
      transform: scale(0.98);
    }
    p.sub {
      font-size: 13px;
      color: #71717a;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h2>Mijozga qo'ng'iroq qilish</h2>
  <p class="phone" id="num">+998 ...</p>
  <a class="call-btn" id="btn" href="#">📞 Qo'ng'iroq qilish</a>
  <p class="sub">Raqam avtomatik terilmoqda...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    let phone = params.get("phone") || "";
    phone = phone.replace(/[^0-9+]/g, "");

    if (phone) {
      if (!phone.startsWith("+")) {
        phone = "+" + phone;
      }
      document.getElementById("num").innerText = phone;
      document.getElementById("btn").href = "tel:" + phone;

      // Avtomatik telefon terish oynasini ochish
      setTimeout(() => {
        window.location.href = "tel:" + phone;
      }, 150);
    } else {
      document.getElementById("num").innerText = "Raqam topilmadi";
      document.getElementById("btn").style.display = "none";
    }
  </script>
</body>
</html>
