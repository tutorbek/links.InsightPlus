  <title>InsightPlus o'quv markazi | Linktree</title>
  <script>
    // O‘zbekiston fasllari: brauzerning vaqt mintaqasiga bog‘liq emas.
    const seasonalBackgrounds = {
      "winter": {
        "mobile": "images/optimized/winter-mobile-c5b18e9462.webp",
        "desktop": "images/optimized/winter-desktop-314c557c75.webp"
      },
      "spring": {
        "mobile": "images/optimized/spring-mobile-0a49453076.webp",
        "desktop": "images/optimized/spring-desktop-226f40c155.webp"
      },
      "summer": {
        "mobile": "images/optimized/summer-mobile-0a642ee2cf.webp",
        "desktop": "images/optimized/summer-desktop-641e95cc15.webp"
      },
      "autumn": {
        "mobile": "images/optimized/autumn-mobile-7193c1f9ae.webp",
        "desktop": "images/optimized/autumn-desktop-dd9781786f.webp"
      }
    };
    const mobileBackground = window.matchMedia("(max-width: 600px)");

    function getSeason(date = new Date()) {
      const month = Number(new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Tashkent",
        month: "numeric"
      }).format(date));
      return ["winter", "spring", "summer", "autumn"][Math.floor((month % 12) / 3)];
    }

    // Fasl fonini vaqtincha ko‘rish; avtomatik fasl uchun null qo‘yiladi.
    const SEASON_PREVIEW = null;
    function updateSeasonBackground() {
      const season = SEASON_PREVIEW || getSeason();
      const source = seasonalBackgrounds[season][mobileBackground.matches ? "mobile" : "desktop"];
      let preload = document.getElementById("seasonBackgroundPreload");
      if (!preload) {
        preload = document.createElement("link");
        preload.id = "seasonBackgroundPreload";
        preload.rel = "preload";
        preload.as = "image";
        preload.fetchPriority = "high";
        document.head.appendChild(preload);
      }
      preload.href = source;
      document.documentElement.dataset.season = season;
      document.documentElement.style.setProperty("--season-background", `url("${source}")`);
    }
    updateSeasonBackground();
    mobileBackground.addEventListener("change", updateSeasonBackground);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) updateSeasonBackground();
    });
  </script>
